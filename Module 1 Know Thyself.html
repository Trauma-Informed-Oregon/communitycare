    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--cream);color:var(--ink);font-family:Inter,Arial,sans-serif;line-height:1.55}button,input,textarea{font:inherit}a{color:var(--teal-dark);text-underline-offset:.18em}:focus-visible{outline:3px solid var(--focus);outline-offset:3px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}.skip{position:absolute;top:-5rem;left:1rem;background:#fff;color:#000;padding:.7rem;z-index:50}.skip:focus{top:1rem}
    .shell{min-height:100vh;display:grid;grid-template-rows:auto 1fr auto}.top{background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;backdrop-filter:blur(8px)}.top-inner{width:min(1120px,calc(100% - 2rem));margin:auto;padding:.7rem 0;display:grid;grid-template-columns:1fr auto;gap:1rem;align-items:center}.brand{font-family:Fraunces,Georgia,serif;font-size:1.1rem;font-weight:600}.brand small{display:block;color:var(--muted);font-family:Inter,Arial,sans-serif;font-size:.72rem;font-weight:600}.top-actions{display:flex;gap:.45rem;flex-wrap:wrap;justify-content:flex-end}.quiet-button,.primary-button{min-height:44px;border-radius:.45rem;padding:.55rem .75rem;font-weight:800;cursor:pointer}.quiet-button{background:#fff;border:2px solid var(--teal-dark);color:var(--teal-dark)}.primary-button{background:var(--teal-dark);border:2px solid var(--teal-dark);color:#fff}.progress-wrap{grid-column:1/-1;display:flex;gap:.7rem;align-items:center}.progress{height:8px;flex:1;background:#e4e8e3;border-radius:4px;overflow:hidden}.progress span{display:block;height:100%;width:0;background:linear-gradient(90deg,#2e7d32,var(--gold),var(--orange),var(--red),var(--blue),var(--slate));transition:width .25s ease}.progress-text{font-size:.78rem;color:var(--muted);min-width:6rem;text-align:right}
    main{width:min(1040px,calc(100% - 2rem));margin:auto;padding:1.5rem 0 6.5rem}.lesson{background:#fff;border:1px solid var(--line);border-radius:1rem;box-shadow:var(--shadow);overflow:hidden;min-height:570px}.slide{padding:clamp(1.2rem,4vw,3rem);min-height:570px;display:grid;align-content:center}.slide[hidden]{display:none}.slide-number{font-size:.77rem;text-transform:uppercase;letter-spacing:.09em;font-weight:800;color:var(--accent,var(--teal));margin-bottom:.55rem}.slide h1,.slide h2{font-family:Fraunces,Georgia,serif;line-height:1.08;margin:.1rem 0 1rem}.slide h1{font-size:clamp(2.25rem,6vw,4.7rem);max-width:850px}.slide h2{font-size:clamp(1.9rem,5vw,3.4rem)}.lead{font-size:clamp(1.08rem,2vw,1.32rem);color:var(--muted);max-width:760px}.accent-line{width:72px;height:6px;background:var(--accent,var(--teal));border-radius:4px;margin:1rem 0}.two-col{display:grid;grid-template-columns:1fr 1fr;gap:1rem}.three-col{display:grid;grid-template-columns:repeat(3,1fr);gap:.8rem}.panel{background:var(--panel,#f1f5f2);border-left:5px solid var(--accent,var(--teal));border-radius:.6rem;padding:1rem}.panel h3{margin:0 0 .4rem;font-size:1.05rem}.panel p{margin:.2rem 0;color:var(--muted)}.big-quote{font-family:Fraunces,Georgia,serif;font-size:clamp(1.5rem,3vw,2.25rem);max-width:760px}.plain-list{padding-left:1.25rem}.plain-list li{margin:.5rem 0}.choice-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:.55rem}.choice{display:flex;gap:.55rem;align-items:start;background:#f2f5f2;border-radius:.5rem;padding:.65rem}.choice input{width:1.25rem;height:1.25rem;flex:none}.field{margin:.8rem 0}.field label,.field legend{display:block;font-weight:800;margin-bottom:.35rem}.field textarea{width:100%;min-height:78px;border:2px solid #75817c;border-radius:.45rem;padding:.65rem;resize:vertical}.field input[type=text]{width:100%;min-height:44px;border:2px solid #75817c;border-radius:.45rem;padding:.6rem}.privacy{background:var(--soft);border-radius:.45rem;padding:.7rem;color:var(--muted);font-size:.88rem}.scenario{border:1px solid var(--line);background:#fffaf0;border-radius:.6rem;padding:1rem;margin:.8rem 0}.downloads{display:flex;flex-wrap:wrap;gap:.55rem;margin-top:1rem}.download{display:inline-flex;align-items:center;min-height:44px;padding:.55rem .7rem;border:2px solid var(--teal-dark);border-radius:.45rem;font-weight:800;text-decoration:none}
    .controls{position:fixed;left:0;right:0;bottom:0;background:rgba(23,33,30,.97);color:#fff;padding:.7rem 1rem;z-index:25}.controls-inner{width:min(1040px,100%);margin:auto;display:grid;grid-template-columns:1fr auto 1fr;gap:.75rem;align-items:center}.controls button{min-height:46px;border-radius:.45rem;font-weight:800;cursor:pointer}.previous{justify-self:start;background:transparent;color:#fff;border:2px solid #9eada8;padding:.55rem .9rem}.next{justify-self:end;background:#fff;color:#17211e;border:2px solid #fff;padding:.55rem .9rem}.controls button:disabled{opacity:.4;cursor:not-allowed}.section-name{text-align:center;font-size:.85rem;color:#d2ddd9}
    dialog{width:min(650px,calc(100% - 2rem));max-height:88vh;border:0;border-radius:.8rem;padding:0;box-shadow:0 24px 80px rgba(0,0,0,.35)}dialog::backdrop{background:rgba(10,20,17,.72)}.dialog-head{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);padding:1rem;display:flex;justify-content:space-between;align-items:start}.dialog-head h2{font-family:Fraunces,Georgia,serif;margin:0}.close{width:44px;height:44px;border:2px solid var(--ink);background:#fff;border-radius:50%;font-weight:800;cursor:pointer}.contents{padding:1rem}.contents ol{margin:0;padding-left:1.5rem}.contents button{border:0;background:transparent;color:var(--teal-dark);text-decoration:underline;text-align:left;padding:.35rem;cursor:pointer}
    .read-mode .lesson{box-shadow:none;background:transparent;border:0}.read-mode .slide,.read-mode .slide[hidden]{display:block;min-height:0;background:#fff;border:1px solid var(--line);border-radius:.75rem;margin:0 0 1rem;padding:clamp(1rem,3vw,2rem)}.read-mode .controls{display:none}.read-mode main{padding-bottom:2rem}.read-mode .progress-wrap{display:none}
    @media(max-width:760px){.top-inner{grid-template-columns:1fr}.top-actions{justify-content:flex-start}.two-col,.three-col,.choice-grid{grid-template-columns:1fr}.lesson,.slide{min-height:0}.slide{padding:1.25rem}.controls-inner{grid-template-columns:auto 1fr auto}.section-name{font-size:.72rem}.brand small{max-width:20rem}}
    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.progress span{transition:none}}
    @media print{.top,.controls,.privacy{display:none!important}body{background:#fff}.lesson{box-shadow:none;border:0}.slide,.slide[hidden]{display:block!important;min-height:0;break-inside:avoid;border-bottom:1px solid #bbb;padding:1.1rem}.slide h1{font-size:2.2rem}.slide h2{font-size:1.8rem}main{width:100%;padding:0}}

<body>
  <a class="skip" href="#lesson">Skip to lesson</a>
  <div class="shell">
    <header class="top"><div class="top-inner"><div class="brand">Module 1: Know Thyself<small>Trauma-Informed De-escalation • Trauma Informed Oregon • Portland State University</small></div><div class="top-actions"><a class="quiet-button" href="Community Care Resource Map.html">Return to resource map</a><button class="quiet-button" id="contentsButton" type="button">Contents</button><button class="quiet-button" id="viewButton" type="button" aria-pressed="false">Read as one page</button></div><div class="progress-wrap"><div class="progress" aria-hidden="true"><span id="progressBar"></span></div><span class="progress-text" id="progressText"></span></div></div></header>
    <main id="lesson" tabindex="-1"><div class="lesson" id="slides" aria-live="polite"></div></main>
    <nav class="controls" aria-label="Lesson navigation"><div class="controls-inner"><button class="previous" id="previous" type="button">← Previous</button><span class="section-name" id="sectionName"></span><button class="next" id="next" type="button">Next →</button></div></nav>
  </div>
  <dialog id="contentsDialog" aria-labelledby="contentsTitle"><div class="dialog-head"><h2 id="contentsTitle">Module contents</h2><button class="close" type="button" aria-label="Close contents">×</button></div><div class="contents"><ol id="contentsList"></ol></div></dialog>
  <script>
    const slides=[
      {id:'welcome',section:'Welcome',title:'Know Thyself',eyebrow:'Module 1',accent:'#0f6e6e',body:`<p class="lead">Community-centered de-escalation begins with knowing your own body, capacity, limits, and choices.</p><div class="accent-line"></div><p class="big-quote">You are the most important tool you have.</p><p class="privacy"><strong>Your choice:</strong> This module is optional. Move at your own pace, skip any activity, or return to the Community Care Resource Map at any time.</p>`},
      {id:'purpose',section:'Welcome',title:'What this training offers',eyebrow:'Start here',accent:'#0f6e6e',body:`<div class="two-col"><div class="panel"><h3>This is</h3><p>Skills for knowing your limits, staying grounded, reading a situation, and supporting safer interactions.</p></div><div class="panel"><h3>This does not replace</h3><p>Clinical care, emergency services, physical-safety training, organizational procedures, or community relationships.</p></div></div><p class="lead">Training helps when it is paired with practice, resources, and people who can share the response.</p>`},
      {id:'sequence',section:'Core foundations',title:'Regulate. Relate. Reason.',eyebrow:'A sequence for hard moments',accent:'#2e7d32',body:`<div class="three-col"><div class="panel"><h3>1. Regulate</h3><p>Attend to the body and reduce activation first.</p></div><div class="panel"><h3>2. Relate</h3><p>Build enough connection for the person to feel your presence.</p></div><div class="panel"><h3>3. Reason</h3><p>Problem-solving works better after the body and relationship have more steadiness.</p></div></div><p>This sequence applies to you and to the person you are supporting.</p>`},
      {id:'continuum',section:'Core foundations',title:'Before, during, and after',eyebrow:'The full response',accent:'#2e7d32',body:`<div class="three-col"><div class="panel"><h3>Prevention</h3><p>Know yourself, your environment, your resources, and your limits.</p></div><div class="panel"><h3>Intervention</h3><p>Choose a response that fits the moment, your role, and your capacity.</p></div><div class="panel"><h3>Postvention</h3><p>Recover, reconnect, review what happened, and change what needs changing.</p></div></div><p class="lead">All three matter. De-escalation is more than what happens at the height of a crisis.</p>`},
      {id:'steady',section:'Know yourself',title:'What does steady feel like?',eyebrow:'Find your baseline',accent:'#2e7d32',body:`<p class="lead">Think of a place, person, memory, or moment when your body felt at ease. Your baseline does not need to look like anyone else’s.</p><div class="field"><label for="steadyText">What do you notice in your body when you feel steady?</label><textarea id="steadyText" data-save="steady" placeholder="Breathing, muscles, temperature, pace, thoughts..."></textarea></div><div class="field"><label for="steadyWord">What word or phrase captures that feeling?</label><input id="steadyWord" type="text" data-save="steady-word" placeholder="At ease, centered, grounded, clear..."></div>`},
      {id:'activation',section:'Know yourself',title:'How do you know activation is rising?',eyebrow:'Notice early',accent:'#a46b00',body:`<p class="lead">Recognition gives you more choices. Look for your earliest signs, before the alarm becomes loud.</p><div class="three-col"><div class="panel"><h3>Body</h3><p>Tension, heart rate, breathing, stomach, jaw, hands, temperature.</p></div><div class="panel"><h3>Thinking</h3><p>Racing thoughts, tunnel vision, going blank, assuming the worst.</p></div><div class="panel"><h3>Behavior</h3><p>Withdrawing, getting louder, freezing, pacing, clenching, fixing.</p></div></div><div class="field"><label for="signalsText">What are your earliest signals?</label><textarea id="signalsText" data-save="signals"></textarea></div>`},
      {id:'activation-points',section:'Know yourself',title:'What tends to activate you?',eyebrow:'Name the pattern',accent:'#a46b00',body:`<p class="lead">A tone, role, environment, power dynamic, or past experience can change how a present moment lands.</p><div class="field"><label for="pointsText">Which situations, tones, people, or environments increase your activation?</label><textarea id="pointsText" data-save="points"></textarea></div><div class="panel"><h3>Old stories can enter new rooms</h3><p>A past experience, expectation, or survival response may shape how you read what is happening now. Pause long enough to separate what is present from what it reminds you of.</p></div>`},
      {id:'capacity',section:'Capacity and limits',title:'Capacity and responsibility are different',eyebrow:'What can you carry?',accent:'#b64c00',body:`<div class="two-col"><div class="panel"><h3>Capacity</h3><p>What you can safely handle based on your body, skills, role, support, and the conditions around you.</p></div><div class="panel"><h3>Responsibility</h3><p>What you believe you should do, what your role requires, or what others expect from you.</p></div></div><p class="lead">Feeling responsible does not create capacity. Naming a limit can be part of a responsible response.</p>`},
      {id:'limits',section:'Capacity and limits',title:'Know when to step in, switch, or step back',eyebrow:'Limits are information',accent:'#b64c00',body:`<div class="two-col"><div class="panel"><h3>Hard limits</h3><p>Conditions where you should not engage, such as weapons, active violence, no safe exit, or being alone without support.</p></div><div class="panel"><h3>Soft limits</h3><p>Conditions where you need to pause and check your activation, health, authority, or available backup.</p></div></div><div class="field"><label for="limitsText">What are your hard and soft limits?</label><textarea id="limitsText" data-save="limits"></textarea></div>`},
      {id:'scan',section:'Read the situation',title:'Scan the situation',eyebrow:'Awareness without assumption',accent:'#a71919',body:`<div class="scenario"><strong>Situation:</strong> Two people are arguing loudly near a bus stop. A parent and two children are waiting nearby.</div><fieldset class="field"><legend>What would you look for?</legend><div class="choice-grid"><label class="choice"><input type="checkbox" data-save="scan-exits">Exits and safer spaces</label><label class="choice"><input type="checkbox" data-save="scan-people">Other people affected</label><label class="choice"><input type="checkbox" data-save="scan-help">Available help or witnesses</label><label class="choice"><input type="checkbox" data-save="scan-distance">Distance and movement</label><label class="choice"><input type="checkbox" data-save="scan-weapons">Visible weapons or immediate danger</label><label class="choice"><input type="checkbox" data-save="scan-assumptions">What I may be assuming</label></div></fieldset><p>Your body reads cues quickly. Listen to it and question the story you attach to the cues.</p>`},
      {id:'causes',section:'Read the situation',title:'Behavior has many possible causes',eyebrow:'Stay curious',accent:'#a71919',body:`<div class="two-col"><div><ul class="plain-list"><li>Mental health distress or substance use</li><li>Trauma responses or survival strategies</li><li>Neurodivergence or disability</li></ul></div><div><ul class="plain-list"><li>Cultural or communication differences</li><li>Pain, fear, grief, or unmet basic needs</li><li>Something you cannot see or know</li></ul></div></div><p class="lead">You do not need to diagnose the cause. Respond to what is happening, stay alert to safety, and leave room for what you do not know.</p>`},
      {id:'self-check',section:'Choose your response',title:'Pause before you act',eyebrow:'Four self-check questions',accent:'#1565c0',body:`<div class="two-col"><div class="field"><label for="knowText">What do I know?</label><textarea id="knowText" data-save="know" placeholder="Observable facts"></textarea></div><div class="field"><label for="unknownText">What do I not know?</label><textarea id="unknownText" data-save="unknown" placeholder="Gaps and unknowns"></textarea></div><div class="field"><label for="canText">What can I do?</label><textarea id="canText" data-save="can" placeholder="Within my capacity and role"></textarea></div><div class="field"><label for="cannotText">What can I not do?</label><textarea id="cannotText" data-save="cannot" placeholder="Limits, boundaries, or not mine to carry"></textarea></div></div>`},
      {id:'response-role',section:'Choose your response',title:'Find your response role',eyebrow:'You do not need every role',accent:'#1565c0',body:`<p>Select the roles that feel safe, realistic, or natural for you.</p><div class="choice-grid" id="responseRoles"></div><div class="field"><label for="roleText">Which two or three could you use with the most steadiness?</label><textarea id="roleText" data-save="role-note"></textarea></div>`},
      {id:'use-role',section:'Choose your response',title:'Ask before using your role',eyebrow:'Safety before action',accent:'#1565c0',body:`<div class="two-col"><div class="panel"><h3>Check first</h3><ul class="plain-list"><li>Am I safe enough?</li><li>Am I already activated?</li><li>Is there an exit?</li><li>Do I need backup?</li><li>Will this help or add heat?</li></ul></div><div class="panel"><h3>Remember</h3><p>You can switch strategies. Delayed support still matters. Calling someone else is a response. Walking away can be a community-care strategy.</p></div></div>`},
      {id:'support-plan',section:'Make your plan',title:'Build a grounding and support plan',eyebrow:'Prepare before you need it',accent:'#536c76',body:`<div class="field"><label for="groundAction">One action that helps me settle in under 30 seconds</label><input id="groundAction" type="text" data-save="ground-action"></div><div class="field"><label for="groundPhrase">One phrase I can say to myself</label><input id="groundPhrase" type="text" data-save="ground-phrase"></div><div class="field"><label for="supportName">One person I can call or text</label><input id="supportName" type="text" data-save="support-name"></div><div class="field"><label for="firstCall">My first-call number for behavioral health support</label><input id="firstCall" type="text" data-save="first-call" placeholder="In Multnomah County: 503-988-4888"></div><p class="privacy">Your responses stay in this browser. They are not transmitted to Trauma Informed Oregon, Portland State University, or any service provider.</p>`},
      {id:'complete',section:'Carry it forward',title:'What will you carry forward?',eyebrow:'Module complete when you decide',accent:'#0f6e6e',body:`<p class="lead">You have identified your baseline, activation signals, limits, response roles, and support plan. You decide when you are done. What matters is what you can reach for in a real moment.</p><div class="field"><label for="practiceText">What is one thing you want to practice?</label><textarea id="practiceText" data-save="practice"></textarea></div><div class="downloads"><button class="primary-button" type="button" onclick="window.print()">Print or save my responses</button><button class="quiet-button" type="button" id="clearResponses">Clear my responses</button><a class="download" href="Module 1 Trauma-Informed De-escalation.pdf" download>Download Module 1 PDF</a><a class="download" href="Activation Worksheet.pdf" download>Download activation worksheet</a><a class="download" href="Response Role Tipsheet.pdf" download>Download response-role tip sheet</a></div><p><a href="Community Care Resource Map.html">Return to the Community Care Resource Map</a></p>`}
    ];
    const roleOptions=[['Direct','Speak clearly when it is safe.'],['Distract','Shift attention or interrupt the pattern.'],['Delegate','Bring in someone with more capacity or authority.'],['Delay','Check in after the moment.'],['Document','Record safely, with attention to consent.'],['Escort','Walk with someone toward safety.'],['Buffer','Create space without physical intervention.'],['Exit Planner','Notice exits and help people leave.'],['Resource Connector','Know who to call and how to reach them.'],['Redirector','Move attention away from the person being targeted.'],['Steady Anchor','Stay grounded and offer practical support.'],['Narrator','Use neutral language to slow the moment.']];
    let current=0,readMode=false;
    const root=document.getElementById('slides'),progress=document.getElementById('progressBar'),progressText=document.getElementById('progressText');
    function slideMarkup(s,i){return `<section class="slide" id="${s.id}" data-slide="${i}" style="--accent:${s.accent}" ${i===current?'':'hidden'} aria-labelledby="title-${i}"><div class="slide-number">${s.eyebrow}</div><h${i===0?'1':'2'} id="title-${i}">${s.title}</h${i===0?'1':'2'}><div class="accent-line"></div>${s.body}</section>`}
    function render(){root.innerHTML=slides.map(slideMarkup).join('');document.getElementById('responseRoles').innerHTML=roleOptions.map(([n,d],i)=>`<label class="choice"><input type="checkbox" data-save="role-${i}"><span><strong>${n}</strong><br>${d}</span></label>`).join('');restoreInputs();updateControls()}
    function updateControls(){document.getElementById('previous').disabled=current===0;document.getElementById('next').textContent=current===slides.length-1?'Return to map →':'Next →';document.getElementById('sectionName').textContent=slides[current].section;progress.style.width=`${((current+1)/slides.length)*100}%`;progressText.textContent=`${current+1} of ${slides.length}`;document.title=`${slides[current].title} | Module 1`;if(!readMode)history.replaceState(null,'',`#${slides[current].id}`);try{localStorage.setItem('tide-module-slide',String(current))}catch(e){}}
    function go(i,focus=true){current=Math.max(0,Math.min(slides.length-1,i));document.querySelectorAll('.slide').forEach((x,n)=>x.hidden=!readMode&&n!==current);updateControls();if(focus&&!readMode){const h=document.getElementById(`title-${current}`);h.setAttribute('tabindex','-1');h.focus();window.scrollTo({top:0,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'})}}
    function saveInput(el){try{localStorage.setItem(`tide-${el.dataset.save}`,el.type==='checkbox'?String(el.checked):el.value)}catch(e){}}
    function restoreInputs(){document.querySelectorAll('[data-save]').forEach(el=>{try{const v=localStorage.getItem(`tide-${el.dataset.save}`);if(v!==null){if(el.type==='checkbox')el.checked=v==='true';else el.value=v}}catch(e){}})}
    document.addEventListener('input',e=>{if(e.target.matches('[data-save]'))saveInput(e.target)});document.addEventListener('change',e=>{if(e.target.matches('[data-save]'))saveInput(e.target)});
    document.getElementById('previous').addEventListener('click',()=>go(current-1));document.getElementById('next').addEventListener('click',()=>{if(current===slides.length-1)location.href='Community Care Resource Map.html';else go(current+1)});
    document.addEventListener('keydown',e=>{if(readMode||['INPUT','TEXTAREA'].includes(document.activeElement.tagName))return;if(e.key==='ArrowRight')go(current+1);if(e.key==='ArrowLeft')go(current-1)});
    const dialog=document.getElementById('contentsDialog');document.getElementById('contentsButton').addEventListener('click',()=>dialog.showModal());dialog.querySelector('.close').addEventListener('click',()=>dialog.close());dialog.addEventListener('click',e=>{if(e.target===dialog)dialog.close()});
    document.getElementById('contentsList').innerHTML=slides.map((s,i)=>`<li><button type="button" data-go="${i}">${s.title}</button></li>`).join('');document.getElementById('contentsList').addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b){dialog.close();if(readMode){document.getElementById(slides[Number(b.dataset.go)].id).scrollIntoView()}else go(Number(b.dataset.go))}});
    document.getElementById('viewButton').addEventListener('click',e=>{readMode=!readMode;document.body.classList.toggle('read-mode',readMode);e.currentTarget.setAttribute('aria-pressed',String(readMode));e.currentTarget.textContent=readMode?'View one screen at a time':'Read as one page';document.querySelectorAll('.slide').forEach((x,n)=>x.hidden=!readMode&&n!==current)});
    const hash=location.hash.slice(1);const hashIndex=slides.findIndex(s=>s.id===hash);let saved=0;try{saved=Number(localStorage.getItem('tide-module-slide'))||0}catch(e){}current=hashIndex>=0?hashIndex:Math.min(saved,slides.length-1);render();
    root.addEventListener('click',e=>{if(e.target.id!=='clearResponses')return;if(!confirm('Clear your saved responses and restart Module 1?'))return;try{Object.keys(localStorage).filter(k=>k.startsWith('tide-')).forEach(k=>localStorage.removeItem(k))}catch(err){}current=0;render();go(0)});
  </script>
</body>
